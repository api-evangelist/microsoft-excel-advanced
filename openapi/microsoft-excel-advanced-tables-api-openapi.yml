openapi: 3.1.0
info:
  title: Microsoft Graph Excel Charts Tables API
  description: 'REST API for reading and writing Excel workbooks stored in OneDrive for

    Business, SharePoint, or a group drive via Microsoft Graph. Supports

    worksheet, table, chart, range, and named-item operations on .xlsx

    workbooks. All requests require an OAuth 2.0 bearer token from the

    Microsoft identity platform; use Files.Read for read operations and

    Files.ReadWrite for write operations. Optional workbook-session-id

    header enables persistent or non-persistent session modes.

    '
  version: v1.0
  contact:
    name: Microsoft Graph Support
    email: graphsdksupport@microsoft.com
  license:
    name: Microsoft Terms of Use
    url: https://www.microsoft.com/en-us/legal/terms-of-use
servers:
- url: https://graph.microsoft.com/v1.0
  description: Microsoft Graph v1.0
security:
- oauth2:
  - Files.ReadWrite
tags:
- name: Tables
  description: Excel table operations
paths:
  /me/drive/items/{item-id}/workbook/worksheets/{worksheet-id}/tables:
    get:
      tags:
      - Tables
      summary: List tables on a worksheet
      operationId: tables_list
      parameters:
      - $ref: '#/components/parameters/itemId'
      - $ref: '#/components/parameters/worksheetId'
      - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: OK
  /me/drive/items/{item-id}/workbook/tables/add:
    post:
      tags:
      - Tables
      summary: Add a table
      operationId: tables_add
      parameters:
      - $ref: '#/components/parameters/itemId'
      - $ref: '#/components/parameters/sessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                hasHeaders:
                  type: boolean
      responses:
        '201':
          description: Created
  /me/drive/items/{item-id}/workbook/tables/{table-id}:
    get:
      tags:
      - Tables
      summary: Get a table
      operationId: tables_get
      parameters:
      - $ref: '#/components/parameters/itemId'
      - $ref: '#/components/parameters/tableId'
      - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: OK
    patch:
      tags:
      - Tables
      summary: Update a table
      operationId: tables_update
      parameters:
      - $ref: '#/components/parameters/itemId'
      - $ref: '#/components/parameters/tableId'
      - $ref: '#/components/parameters/sessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                showHeaders:
                  type: boolean
                showTotals:
                  type: boolean
                style:
                  type: string
      responses:
        '200':
          description: OK
    delete:
      tags:
      - Tables
      summary: Delete a table
      operationId: tables_delete
      parameters:
      - $ref: '#/components/parameters/itemId'
      - $ref: '#/components/parameters/tableId'
      - $ref: '#/components/parameters/sessionId'
      responses:
        '204':
          description: No Content
components:
  parameters:
    tableId:
      name: table-id
      in: path
      required: true
      schema:
        type: string
    sessionId:
      name: workbook-session-id
      in: header
      required: false
      description: Optional session id from createSession to enable persistent or non-persistent session mode
      schema:
        type: string
    worksheetId:
      name: worksheet-id
      in: path
      required: true
      schema:
        type: string
    itemId:
      name: item-id
      in: path
      required: true
      description: DriveItem ID of the .xlsx workbook
      schema:
        type: string
  securitySchemes:
    oauth2:
      type: oauth2
      description: Microsoft Entra ID OAuth 2.0
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
          scopes:
            Files.Read: Read user files
            Files.ReadWrite: Read and write user files
            Sites.Read.All: Read items in all site collections
            Sites.ReadWrite.All: Read and write items in all site collections
